[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stfm-fno"
version = "0.2.0"
description = "Spatio-temporal field-modulated Fourier neural operator for transmission-loss estimation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yufei Yang" }]
keywords = ["underwater acoustics", "Fourier neural operator", "transmission loss", "FiLM"]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "h5py==3.11.0",
  "torch==2.5.1",
  "scikit-image==0.25.2"
]

[project.urls]
Repository = "https://github.com/yufeila/TAM-FNO-Underwater-Acoustic-Prediction"
Homepage = "https://yufeila.github.io/TAM-FNO-Underwater-Acoustic-Prediction/"

[project.scripts]
stfm-fno = "stfm_fno.experiments:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
